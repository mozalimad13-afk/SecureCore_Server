[pytest]
addopts = -ra --ignore=scripts
norecursedirs = finalProjectCS4 .venv venv env */site-packages/* dist build
filterwarnings =
    # SQLAlchemy emits DeprecationWarning from inside its internals on Python 3.12+
    # due to `datetime.utcnow()` usage. This is third-party noise and not actionable
    # for our codebase.
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning:sqlalchemy\.
